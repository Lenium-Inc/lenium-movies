<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <!-- The app's base colour. It was #0b0b0e, which matches no other value in
         the palette: the shell resolves to #0b0c10, so the browser chrome was a
         slightly different black from the page it frames. -->
    <meta name="theme-color" content="#0b0c10" />

    <!--
      The static head.

      These tags are here, duplicated from `client/src/lib/seo.ts`, because this
      is the only SEO surface a crawler reliably reads -- it is the HTML it gets
      before any JavaScript runs, and `RouteSeo` cannot help until the bundle
      has loaded and executed.

      Two rules keep the duplication honest, both enforced by `seo.test.ts`:

      1. The title, description and keywords below are asserted to be exactly
         what the module generates for "/". Editing one without the other fails
         the suite instead of quietly drifting, which is what happened for six
         months when a separate `seoConfig` object carried its own copies.
      2. Nothing here hardcodes a hostname. `__SITE_ORIGIN__` is replaced at
         build time by scripts/seoOriginPlugin.ts with the value of
         VITE_SITE_URL, the same variable the runtime resolves. With it unset the
         token becomes empty and every URL below stays root-relative, which each
         consumer resolves against the host actually serving the page -- the
         alternative, a production URL baked into the file, made every preview
         deploy claim to be the live site.
    -->
    <!--
      The region between these two markers is the only part of this file that
      describes the route. `scripts/seoOriginPlugin.ts` replaces it wholesale to
      prerender /terms, /privacy and /dmca, each of which otherwise served this
      page's title and `canonical="/"` -- which is to say, the site had exactly one
      indexable URL and its own sitemap contradicted the other three.

      Everything outside the markers is identical on every route: the icons, the
      verification token, the site-level JSON-LD. Regenerating those per route
      would mean a second copy to keep in step, for no benefit.

      The tags inside are generated from `client/src/lib/seo.ts` by the same
      function that writes the head at runtime, and `seo.test.ts` asserts the copy
      here still matches what that module produces for "/".
    -->
    <!-- seo:route-head:start -->
    <title>Stream Vy — Watch Movies & TV Shows</title>
    <meta
      name="description"
      content="High-end minimalist VOD streaming platform."
    />
    <meta
      name="keywords"
      content="free movies, stream movies online, public domain movies, free streaming, watch movies free, public domain films, movie database"
    />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <link rel="canonical" href="__SITE_ORIGIN__/" />

    <!--
      Open Graph.

      og:image points at the brand mark, which is an SVG. Facebook, X/Twitter and
      LinkedIn do not render SVG here and want a raster image of at least
      1200x630, so these cards will show no picture on those platforms until a
      real preview image exists. That is a design deliverable rather than a code
      one, so it is recorded as a single constant -- OG_IMAGE in lib/seo.ts, and
      these three tags -- rather than left to be rediscovered.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lenium" />
    <meta
      property="og:title"
      content="Stream Vy — Watch Movies & TV Shows"
    />
    <meta
      property="og:description"
      content="High-end minimalist VOD streaming platform."
    />
    <meta property="og:url" content="https://streamvy.me/" />
    <meta property="og:image" content="__SITE_ORIGIN__/lenium-mark.svg" />
    <meta property="og:image:alt" content="The Lenium mark" />
    <meta property="og:locale" content="en_US" />

    <!--
      Twitter.

      twitter:creator and twitter:site were removed. Both asserted an @StreamVy
      account; an unverified handle on a site that does not control it is a claim
      made on its behalf to a third party, and it buys nothing -- attribution is
      controlled by who publishes the link, not by this tag.
    -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Stream Vy — Watch Movies & TV Shows"
    />
    <meta
      name="twitter:description"
      content="High-end minimalist VOD streaming platform."
    />
    <meta name="twitter:image" content="__SITE_ORIGIN__/lenium-mark.svg" />
    <!-- seo:route-head:end -->

    <meta name="application-name" content="Lenium" />
    <meta name="apple-mobile-web-app-title" content="Lenium" />
    <meta name="author" content="Lenium Inc" />
    <meta name="creator" content="Lenium Inc" />
    <meta name="publisher" content="Lenium Inc" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!--
      Structured data.

      `data-jsonld` is what makes this block adoptable: `RouteSeo` writes the
      same id, so navigating to a title page updates this node in place instead of
      appending a second WebSite block beside it. Without the attribute the
      applier could not see this node and every route change would have left
      another copy of the homepage's schema in the head.

      Two blocks were deleted here. A VideoObject with `"duration": "PT0H0M0S"`
      described the entire website as a zero-length video, on every page; and a
      BreadcrumbList whose two items were "Home" and "Browse Movies", both
      pointing at "/", described a hierarchy that does not exist. Both are
      malformed structured data rather than merely redundant, and a crawler that
      reads them has to decide what to believe about a site whose other claims
      are accurate.
    -->
    <script type="application/ld+json" data-jsonld="site-jsonld">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Lenium",
        "alternateName": ["Lenium"],
        "url": "__SITE_ORIGIN__/",
        "description": "High-end minimalist VOD streaming platform.",
        "image": "__SITE_ORIGIN__/lenium-mark.svg",
        "sameAs": ["https://github.com/Lenium-Inc/lenium-movies"],
        "creator": {
          "@type": "Organization",
          "name": "Lenium Inc",
          "url": "https://github.com/Lenium-Inc"
        },
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "__SITE_ORIGIN__/?search={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <script type="application/ld+json" data-jsonld="org-jsonld">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Lenium Inc",
        "url": "https://github.com/Lenium-Inc",
        "logo": "__SITE_ORIGIN__/lenium-mark.svg",
        "sameAs": ["https://github.com/Lenium-Inc/lenium-movies"]
      }
    </script>

    <meta
      name="google-site-verification"
      content="j7jpZ4Rw36PBl13aJRvA50xKeobt_LhrirSzDBWUthc"
    />

    <!--
      Icons. Only the SVG, which is the one that exists: `favicon.ico` and an
      `.ico` alternate were both referenced and 404'd, and an SVG apple-touch-icon
      is ignored by iOS, which wants a 180x180 PNG.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Every poster, backdrop and still on this site comes from TMDB. -->
    <link rel="dns-prefetch" href="//www.themoviedb.org" />
    <link rel="preconnect" href="https://www.themoviedb.org" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      No analytics beacons, and none may be added unconditionally.

      Two used to ship here: an Umami script whose src was the literal
      `%VITE_ANALYTICS_ENDPOINT%` (Vite only inlines `import.meta.env.VITE_*`, so
      an unset var left the placeholder in dist and every page load requested
      /%VITE_ANALYTICS_ENDPOINT%/umami), and a Cloudflare beacon that ran
      unconditionally. `/privacy` tells viewers in a legal section that there are
      no third-party analytics scripts in this product, and that has to stay
      literally true.

      This file used to end by pointing at CookieBanner as the place a future
      consent choice would live. That component has since been deleted, because
      there is nothing left to consent to: the only third parties are the embed
      providers and TMDB, both named on the privacy page. If analytics is ever
      wanted, it needs a consent mechanism built at the same time as the policy
      change, not a script tag and a promise to add one later.
    -->
  </body>
</html>
