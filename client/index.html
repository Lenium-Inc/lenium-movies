<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <meta name="theme-color" content="#0b0b0e" />
    <meta
      name="description"
      content="Discover public-domain and openly licensed movies on Stream Vy. Browse curated films, search by title or genre, and build your personal watchlist."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="googlebot" content="index, follow" />
    <meta name="application-name" content="Stream Vy" />
    <meta name="author" content="Stream Vy" />
    <link rel="canonical" href="https://vy-virid.vercel.app/" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stream Vy" />
    <meta property="og:title" content="Stream Vy — Discover films worth watching" />
    <meta
      property="og:description"
      content="Discover public-domain and openly licensed movies, browse by genre, and build your personal watchlist."
    />
    <meta property="og:url" content="https://vy-virid.vercel.app/" />
    <meta property="og:image" content="https://vy-virid.vercel.app/stream-vy-mark.svg" />
    <meta property="og:image:alt" content="Stream Vy movie discovery" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Stream Vy — Discover films worth watching" />
    <meta
      name="twitter:description"
      content="Discover public-domain and openly licensed movies, browse by genre, and build your personal watchlist."
    />
    <meta name="twitter:image" content="https://vy-virid.vercel.app/stream-vy-mark.svg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Stream Vy",
        "url": "https://vy-virid.vercel.app/",
        "description": "A movie discovery platform for public-domain and openly licensed films.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://vy-virid.vercel.app/?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <meta
      name="google-site-verification"
      content="j7jpZ4Rw36PBl13aJRvA50xKeobt_LhrirSzDBWUthc"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" sizes="32x32" />
    <title>Stream Vy — Discover films worth watching</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      No analytics beacons.

      This used to ship two: an Umami script whose src was the literal
      `%VITE_ANALYTICS_ENDPOINT%` (Vite only inlines the literal string
      `import.meta.env.VITE_*`, so an unset var left the placeholder in dist
      and every page load requested /%VITE_ANALYTICS_ENDPOINT%/umami), and a
      Cloudflare beacon that ran unconditionally. The cookie notice meanwhile
      told viewers "no third-party analytics in this app" -- which was false.

      Removed rather than gated so the privacy notice is true by construction.
      If analytics is wanted later, it should be added behind the consent
      choice in CookieBanner, not unconditionally in this file.
    -->
  </body>
</html>
