<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" role="img" aria-label="Stream Vy" style="color:#F4F4F1">
  <title>Stream Vy</title>
  <!--
    The full form of the brand mark, for 20px and up: three sides of a rounded
    frame, open on the right, with a solid play triangle seated in the opening.

    Both paths are `currentColor`, so the mark can be dropped onto any surface
    and tinted by whatever colour surrounds it. The root `color` is set to the
    app's off-white so the file is still correct when referenced standalone via
    <img>, where it cannot inherit from the page — override it inline
    (style="color:#fff") or through a CSS rule when embedding.

    This is the mark only. The wordmark is deliberately NOT outlined here: it
    stays live DM Sans text in the app (see components/brand/Brand.tsx) so it
    tracks the loaded webfont, the theme colour and the real type metrics
    instead of freezing a captured copy of the letterforms.
  -->
  <path d="M25.4 4H11.4A7.4 7.4 0 0 0 4 11.4v9.2A7.4 7.4 0 0 0 11.4 28h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M18.2 10.6 27.6 16l-9.4 5.4Z" fill="currentColor" />
</svg>
