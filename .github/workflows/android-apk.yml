name: Android APK

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "client/**"
      - "capacitor.config.ts"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch: {}

env:
  # The API actually serving production. The old default,
  # https://api.vy.streamvy.me, does not resolve, so every APK built from it
  # could never reach the backend. Override with a repository variable when the
  # API moves.
  VITE_STREAMVY_API_BASE_URL: ${{ vars.VITE_STREAMVY_API_BASE_URL || 'https://movie-api.streamvy.me' }}
  # A monotonic versionCode is what lets a new APK install *over* the old one.
  # GitHub's run number only ever increases, so it is the natural source.
  CAP_VERSION_CODE: ${{ github.run_number }}
  CAP_VERSION_NAME: 1.${{ github.run_number }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Referenced through `env` in the signing step because GitHub does not
      # allow the `secrets` context directly inside an `if:` expression.
      SIGNING_MATERIAL_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npx vite build

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Sync Capacitor
        run: npx cap sync android

      # A stable signing key is what makes "install over the top" possible. If
      # the repository has no keystore secret yet, the build still succeeds with
      # the ephemeral debug key -- it just cannot update an existing install.
      - name: Configure update signing
        if: env.SIGNING_MATERIAL_B64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$SIGNING_MATERIAL_B64" | base64 --decode > android/app/streamvy-release.keystore
          echo "ANDROID_KEYSTORE_PATH=$PWD/android/app/streamvy-release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p artifact
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "artifact/streamvy-${{ github.run_number }}-debug.apk"
          # A stable name for the rolling release below, so the site can link
          # to one URL instead of a run-number that changes every build.
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "artifact/streamvy-android.apk"

      # Read by the app's update check (`/api/android-version`) before it offers
      # the download. Published next to the APK so the two can never disagree.
      - name: Write update manifest
        run: |
          cat > artifact/android-version.json <<EOF
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "1.${{ github.run_number }}",
            "url": "https://github.com/Lenium-Inc/lenium-movies/releases/download/android-latest/streamvy-android.apk",
            "notes": "Build ${{ github.run_number }} (${GITHUB_SHA::7})."
          }
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: streamvy-android-debug
          path: |
            artifact/*.apk
            artifact/android-version.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest > /dev/null 2>&1; then
            gh release upload android-latest \
              artifact/streamvy-android.apk \
              artifact/android-version.json --clobber
          else
            gh release create android-latest \
              artifact/streamvy-android.apk \
              artifact/android-version.json \
              --title "Stream Vy for Android" \
              --notes "Latest debug build from main. Download streamvy-android.apk below." \
              --latest
          fi
