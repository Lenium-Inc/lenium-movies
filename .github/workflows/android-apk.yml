name: Android APK

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "client/**"
      - "capacitor.config.ts"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch: {}

env:
  # The API actually serving production. The old default,
  # https://api.vy.streamvy.me, does not resolve, so every APK built from it
  # could never reach the backend. Override with a repository variable when the
  # API moves.
  VITE_STREAMVY_API_BASE_URL: ${{ vars.VITE_STREAMVY_API_BASE_URL || 'https://movie-api.streamvy.me' }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npx vite build

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p artifact
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "artifact/streamvy-${{ github.run_number }}-debug.apk"
          # A stable name for the rolling release below, so the site can link
          # to one URL instead of a run-number that changes every build.
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "artifact/streamvy-android.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: streamvy-android-debug
          path: artifact/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest > /dev/null 2>&1; then
            gh release upload android-latest artifact/streamvy-android.apk --clobber
          else
            gh release create android-latest artifact/streamvy-android.apk \
              --title "Stream Vy for Android" \
              --notes "Latest debug build from main. Download streamvy-android.apk below." \
              --latest
          fi
